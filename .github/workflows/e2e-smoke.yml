name: E2E Smoke

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app for smoke E2E
        run: npm run build:ts

      - name: Install Playwright browser
        run: npm run e2e:visual:install

      - name: Ensure E2E data directory exists
        run: mkdir -p data

      - name: Run smoke E2E
        run: npm run test:e2e:smoke

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-smoke-artifacts
          path: |
            playwright-report
            test-results

  e2e-visual:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify and run visual regression suite
        run: npm run test:e2e:visual

      - name: Upload visual regression artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-artifacts
          if-no-files-found: warn
          retention-days: 14
          path: |
            playwright-report
            test-results
